sonar.projectKey=ha-scheduled-scenes
sonar.projectName=ha-scheduled-scenes

sonar.sources=custom_components/scheduled_scenes
sonar.tests=tests

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/__pycache__/**,**/.venv/**,.dev/**
sonar.coverage.exclusions=tests/**,custom_components/scheduled_scenes/__init__.py

sonar.sourceEncoding=UTF-8

# S7503 ("use await or drop async") is a false positive for Home Assistant
# integration entry points (async_setup*, service handlers, platform setup) —
# the framework requires these to be coroutines even when they have nothing
# to await.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e1.resourceKey=custom_components/scheduled_scenes/**/*.py
