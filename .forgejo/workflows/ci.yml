name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: hassfest-${{ runner.os }}-py3.13-v2
      - name: Install homeassistant + fetch matching core
        run: |
          python -m pip install --upgrade pip
          python -m pip install homeassistant tqdm ruff
          HA_VERSION=$(python -c "from importlib.metadata import version; print(version('homeassistant'))")
          echo "HA_VERSION=$HA_VERSION" >>"$GITHUB_ENV"
          rm -rf /tmp/ha-core
          git clone --depth 1 --branch "$HA_VERSION" \
            https://github.com/home-assistant/core /tmp/ha-core
      - name: Run hassfest
        run: |
          cd /tmp/ha-core
          python -m script.hassfest \
            --integration-path "$GITHUB_WORKSPACE/custom_components/scheduled_scenes" \
            --action validate

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          github_token: ${{ secrets.HACS_GITHUB_TOKEN }}
          repository: timmikk/ha-scheduled-scenes
          category: integration
          ignore: brands

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements_test.txt
      - run: |
          pytest -q --cov=custom_components/scheduled_scenes --cov-branch \
            --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v3
        with:
          name: coverage-xml
          path: coverage.xml

  sonar:
    runs-on: ubuntu-latest
    needs: [pytest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v3
        with:
          name: coverage-xml
      - name: Cache sonar-scanner
        id: sonar-cache
        uses: actions/cache@v4
        with:
          path: /opt/sonar-scanner-6.2.1.4610-linux-x64
          key: sonar-scanner-6.2.1.4610-${{ runner.os }}
      - name: Install sonar-scanner
        if: steps.sonar-cache.outputs.cache-hit != 'true'
        run: |
          apt-get update -qq && apt-get install -y -qq unzip > /dev/null 2>&1
          curl -sL "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip" -o /tmp/sonar.zip
          unzip -q /tmp/sonar.zip -d /opt
          rm /tmp/sonar.zip
      - name: Link sonar-scanner
        run: ln -sf /opt/sonar-scanner-6.2.1.4610-linux-x64/bin/sonar-scanner /usr/local/bin/sonar-scanner
      - name: SonarQube analysis
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: sonar-scanner
